[project]
name = "comfyui-wevisone"
version = "0.2.2"
description = "ComfyUI adapters for Tencent WeVisOne-VL and Mask2Alpha"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "flybirdxx" }]
keywords = ["comfyui", "wevisone", "segmentation", "matting", "vision-language"]

[project.urls]
Repository = "https://github.com/flybirdxx/ComfyUI-WeVisOne"
Issues = "https://github.com/flybirdxx/ComfyUI-WeVisOne/issues"
Upstream = "https://github.com/Tencent/WeVisOne-VL"

[tool.ruff]
line-length = 120
exclude = ["vendor", "runtime"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
